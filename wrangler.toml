name = "junduoduo"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "junduoduo"
# D1 数据库：junduoduo
database_id = "59fc3f6d-e7c6-443c-982c-a9adda6a8ab0"

[vars]
GROUP_NAME = "骏和屋拼单"
PREFECTURE = "大阪府"
BUYER_EMAIL = "lengche2222@gmail.com"
# 发件地址：域名需要先在 Resend 后台验证，例如 "骏和屋拼单 <pin@你的域名>"
MAIL_FROM = "onboarding@resend.dev"
# 网站地址，邮件里的“在拼单页查看”链接用；留空则用访问地址
SITE_URL = "https://junduoduo.toolfavor.com"

# 以下用 `npx wrangler secret put 名字` 设置，不要写进这个文件：
#   ADMIN_KEY       团长后台口令
#   RESEND_API_KEY  Resend 的 API Key
#   PIN_SALT        PIN 加盐用的随机字符串
